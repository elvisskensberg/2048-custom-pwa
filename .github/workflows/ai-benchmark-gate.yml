name: AI Benchmark Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ai_benchmark_gate:
    name: Monopoly Deal AI Benchmark Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cube-swipe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cube-swipe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run AI tuning and threshold tests
        run: npm test -- --run src/monopoly-deal/aiTuningHarness.test.ts src/monopoly-deal/aiProfileBenchmark.test.ts
